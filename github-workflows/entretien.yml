# ═══════════════════════════════════════════════════════════════════════════
#  CURIO — ENTRETIEN
#
#    purger      sort du catalogue maitre tout ce que vous avez mis dans
#                consignes/exclusions.txt. C est le geste qui suit « Copier
#                pour exclusions.txt » dans la curation.
#    recompter   recalcule anecdotes/index.json, donc les chiffres du site
#    verifier    controle que les articles existent toujours sur Wikipedia
#    nettoyer    retire les doublons herites des versions anterieures
#    reclasser   recalcule les potentiels de l ancien catalog.json
#    accorder    (re)mesure l accord entre votre phrase et l article, et
#                allume le badge « a verifier » sur ceux qui n ont aucun mot
#                en commun. Instantane, gratuit, ne retire rien.
#    auditer     LA PASSE QUALITE. Reprend un par un les seuls sujets que
#                vous avez RETENUS dans la console, verifie que l article
#                existe toujours, qu il est assez fourni, que ce n est pas une
#                page d homonymie, que votre phrase parle bien de cet
#                article-la. Ecrit audit-retenus.csv. Ne supprime rien.
#                Cochez « appliquer » pour ecarter d un coup ce qui echoue.
#    reparer     LA REMISE AU PROPRE. catalogue-maitre.json tient un registre
#                (« ecrit », « en ligne ») et anecdotes/ porte la verite,
#                puisque c est ce que l application lit. Quand les deux
#                divergent, un sujet s affiche « en ligne » a la Selection,
#                reste introuvable dans les publies et manque sur le site.
#                Cette operation recopie ce que disent les fiches dans le
#                registre. Aucune fiche n est touchee, rien n est publie ni
#                depublie. Gratuit.
#    doublons    cherche les redites parmi les seules fiches EN LIGNE, dans
#                la meme langue. Ecrit doublons.csv. Ne retire rien : c est
#                vous qui tranchez, avec « 5 · Publier → retirer ».
#    reconstruire RECOMPOSE LE SITE depuis parts/. Le nom du produit, le logo,
#                les langues publiees, les photos et le sommaire sont graves
#                dans app.html et index.html a la construction : cette action
#                est ce qui fait qu un changement de nom prend effet sans
#                attendre une livraison. Gratuite, aucune fiche touchee.
#                La console la declenche toute seule quand vous enregistrez
#                le nom, le logo ou le rythme.
#    repartir-a-zero  VIDER LA POUBELLE DU CATALOGUE. « Le saviez-vous ? »
#                compte des milliers de pages et il s en ajoute une chaque
#                jour : au bout de quelques mois le catalogue porte des
#                dizaines de milliers de sujets dont vous n avez rien dit,
#                et on ne sait plus ou regarder.
#                CE QUI EST GARDE, quoi qu il arrive : tout sujet qui a une
#                fiche (ecrite, au stock ou en ligne), vos sujets phares, vos
#                ajouts manuels, et ce que vous aviez retire. Le choix
#                « garder » decide du seul point restant :
#                  menage  (defaut) garde aussi vos RETENUS pas encore ecrits
#                  rase             ils partent aussi
#                AUCUNE FICHE N EST OUVERTE. L ancien catalogue est recopie
#                dans catalogue-maitre.avant-remise-a-zero.json avant la
#                premiere ecriture : pour revenir en arriere, renommez-le.
#                Il faut ecrire VIDER dans la case « confirmer ». Gratuit.
#    ranger      remet chaque sujet dans son univers d apres son article.
#                Les archives « Le saviez-vous ? » ont des sections datees,
#                qui ne disent rien du sujet : tout tombait dans Mysteres.
#                Ne touche ni vos sujets phares ni les fiches deja ecrites.
#
#  Les deux derniers ne servent qu aux depots anterieurs a la version 8 :
#  le catalogue maitre ne peut plus contenir de doublon.
# ═══════════════════════════════════════════════════════════════════════════
name: Entretien

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Quelle operation ?"
        required: true
        default: purger
        type: choice
        options:
          - purger
          - recompter
          - verifier
          - nettoyer
          - reclasser
          - accorder
          - ranger
          - auditer
          - reparer
          - doublons
          - reconstruire
          - servir
          - blog
          - icones
          - credits
          - reetaler
          - repartir-a-zero
      appliquer:
        description: "auditer : ecarter ce qui echoue (sinon on ne fait que lire)"
        required: false
        default: false
        type: boolean
      garder:
        description: "repartir-a-zero : garder aussi vos retenus pas encore ecrits ?"
        required: false
        default: menage
        type: choice
        options:
          - menage
          - rase
      confirmer:
        description: "repartir-a-zero : VIDER  ·  reetaler : REETALER"
        required: false
        default: ""


permissions:
  contents: write

jobs:
  curio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CURIO_CONTACT: "https://github.com/${{ github.repository }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache
        uses: actions/cache@v4
        with:
          path: tools/.cache
          key: curio-cache-${{ github.run_id }}
          restore-keys: |
            curio-cache-
      - name: Verifier les scripts
        run: |
          for f in tools/build-catalog.mjs tools/write-anecdotes.mjs tools/controler.mjs tools/publier.mjs; do
            [ -f "$f" ] || { echo "::error::$f est absent du depot. Importez le dossier tools/ en entier."; exit 1; }
            node --check "$f"
          done

      - name: Executer
        run: |
          set -o pipefail
          case "${{ github.event.inputs.operation }}" in
            purger)    node tools/build-catalog.mjs --purger    2>&1 | tee curio.log ;;
            recompter) node tools/write-anecdotes.mjs --index   2>&1 | tee curio.log ;;
            verifier)  node tools/build-catalog.mjs --verifier  2>&1 | tee curio.log ;;
            nettoyer)  node tools/build-catalog.mjs --nettoyer  2>&1 | tee curio.log ;;
            reclasser) node tools/build-catalog.mjs --reclasser 2>&1 | tee curio.log ;;
            accorder)  node tools/build-catalog.mjs --accorder  2>&1 | tee curio.log ;;
            ranger)    node tools/build-catalog.mjs --ranger    2>&1 | tee curio.log ;;
            auditer)   node tools/build-catalog.mjs --auditer ${{ github.event.inputs.appliquer == 'true' && '--appliquer' || '' }} 2>&1 | tee curio.log ;;
            reparer)   node tools/publier.mjs --reparer  2>&1 | tee curio.log
                       node tools/write-anecdotes.mjs --index 2>&1 | tee -a curio.log ;;
            doublons)  node tools/publier.mjs --doublons 2>&1 | tee curio.log ;;
            repartir-a-zero)
              # Le garde-fou. Sans le mot, on ne fait rien : cette operation
              # est la seule du produit qui retire des lignes du catalogue.
              if [ "${{ github.event.inputs.confirmer }}" != "VIDER" ]; then
                echo "::error::Pour vider le catalogue, ecrivez VIDER dans la case « confirmer »." | tee curio.log
                exit 1
              fi
              G="${{ github.event.inputs.garder }}"
              [ -z "$G" ] && G=menage
              node tools/build-catalog.mjs --repartir-zero "$G" 2>&1 | tee curio.log
              # Et tout de suite apres : le registre est remis d accord avec
              # les fiches, et les chiffres du site recalcules. Sans ces deux
              # passes, un sujet garde pour sa fiche pourrait rester marque
              # « a ecrire » et etre repropose a l ecriture.
              node tools/publier.mjs --reparer 2>&1 | tee -a curio.log
              node tools/write-anecdotes.mjs --index 2>&1 | tee -a curio.log ;;
            reconstruire)
              # RECONSTRUIRE LE SITE. Le nom du produit, le logo, les langues
              # publiees, les photos, le sommaire : tous sont graves dans
              # app.html et index.html a la construction. Sans cette action, il
              # fallait qu'on vous livre un paquet pour qu'un simple changement
              # de nom prenne effet. Elle ne coute rien et ne touche a aucune
              # fiche : elle recompose les deux pages depuis parts/.
              sh build.sh 2>&1 | tee curio.log
              node tools/servir.mjs 2>&1 | tee -a curio.log ;;
            blog)
              # LE BLOG. Une page publique par fiche deja en ligne, une par
              # jour. Il lit fiches/ — jamais le stock. Regle dans
              # consignes/blog.txt, et eteint tant que « actif: oui » n y est
              # pas ecrit.
              node tools/servir.mjs 2>&1 | tee curio.log
              node tools/blog.mjs   2>&1 | tee -a curio.log ;;
            icones)
              # LES ICONES DE L APPLICATION INSTALLEE, refaites a partir de
              # votre logo. Deposez icones/logo.svg (ou .png) par
              # Add file -> Upload files, et lancez ceci : les quatre
              # fichiers curio-*.png sont refabriques aux bonnes tailles.
              #
              # Les anciennes sont recopiees dans icones/avant-logo/ avant
              # d etre remplacees.
              npm i --no-save --silent sharp 2>&1 | tail -2
              node tools/icones.mjs 2>&1 | tee curio.log
              sh build.sh 2>&1 | tee -a curio.log ;;
            credits)
              # LES CREDITS D IMAGES. Les photos de Wikimedia Commons ne sont
              # pas libres de droits : la plupart exigent l auteur et la
              # licence. Cet outil va les chercher et les ecrit dans les
              # fiches. Le blog n affiche une image QUE si elle est creditee.
              node tools/credits.mjs 2>&1 | tee curio.log ;;
            reetaler)
              # REETALER LES DATES DE PUBLICATION. A lancer une fois, apres
              # une remise en ligne massive qui a pose la meme date sur tout
              # le catalogue — c est ce qui fait dire a index.json « 269
              # nouveautes cette semaine » sur un catalogue de 269.
              #
              # Sans le mot REETALER dans « confirmer », il ne fait que dire
              # ce qu il ferait.
              node tools/reetaler.mjs --confirmer "${{ github.event.inputs.confirmer }}" 2>&1 | tee curio.log
              node tools/write-anecdotes.mjs --index 2>&1 | tee -a curio.log
              node tools/servir.mjs 2>&1 | tee -a curio.log ;;
            servir)
              # PREPARER CE QUE LE SITE SERT. fiches/ ne contient que les
              # anecdotes en ligne ; anecdotes/ garde tout, stock compris, et
              # n est plus servi au lecteur. A lancer si vous avez modifie des
              # fiches a la main.
              node tools/servir.mjs 2>&1 | tee curio.log ;;
          esac

      - name: Compte rendu
        if: always()
        run: |
          {
            echo "## Curio — entretien"
            echo ""
            echo '```'
            tail -70 curio.log 2>/dev/null || echo "(pas de journal)"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Enregistrer
        if: always()
        run: |
          git config user.name  "curio-bot"
          git config user.email "curio-bot@users.noreply.github.com"
          rm -f curio.log
          B=consignes/blog.txt
          [ -f "$B" ] || B=consignes/blog.exemple.txt
          CH=$(sed -n 's/^[[:space:]]*chemin:[[:space:]]*//p' "$B" 2>/dev/null | head -1 | tr -d '[:space:]/')
          [ -n "$CH" ] || CH=histoires
          for p in catalogue-maitre.json catalogue-maitre.csv catalogue-maitre.avant-remise-a-zero.json catalog.json rapport-phares.csv audit-retenus.csv doublons.csv anecdotes fiches "$CH" sitemap.xml robots.txt controle.csv consignes/exclusions.txt consignes/sujets-phares.txt consignes/sujets-phares.avant-nettoyage.txt consignes/decisions.json app.html index.html console.html atelier.html sw.js version.json marque.json manifest.webmanifest icones; do
            if [ -e "$p" ]; then
              git add -A -- "$p" || { echo "::error::git add $p a echoue."; exit 1; }
            fi
          done
          if git diff --cached --quiet; then
            echo "Rien de nouveau a enregistrer."
            echo "> Rien de nouveau a enregistrer." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git commit -m "curio: entretien"
          git pull --rebase --autostash || true
          if git push; then
            echo "Enregistre et publie."
          else
            echo "::error::Le push a echoue. Settings -> Actions -> General -> Workflow permissions -> Read and write."
            exit 1
          fi
